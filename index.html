<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đấu Trường Tri Thức 1v1 - Bài 7 GDKT&PL 10</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(22, 31, 49, 0.85);
      --p1-color: #00f2ff;
      --p2-color: #ff0055;
      --accent-yellow: #ffe600;
      --text-light: #f0f4f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: var(--text-light);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      position: relative;
    }

    /* Header & Player Bar */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .player-card.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .p1-card.active {
      background: rgba(0, 242, 255, 0.15);
      border: 1px solid var(--p1-color);
      box-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
    }

    .p2-card.active {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid var(--p2-color);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }

    .player-name {
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    .p1-card .player-name { color: var(--p1-color); }
    .p2-card .player-name { color: var(--p2-color); }

    .score {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .versus {
      font-weight: 900;
      font-style: italic;
      color: #666;
      font-size: 0.9rem;
    }

    /* Timer Bar */
    .timer-container {
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f2ff, #ffe600, #ff0055);
      transition: width 0.1s linear;
    }

    /* Turn Banner */
    .turn-banner {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .turn-banner.p1 {
      background: rgba(0, 242, 255, 0.2);
      color: var(--p1-color);
      border: 1px solid var(--p1-color);
    }

    .turn-banner.p2 {
      background: rgba(255, 0, 85, 0.2);
      color: var(--p2-color);
      border: 1px solid var(--p2-color);
    }

    /* Question Box */
    .question-box {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 10px;
    }

    .question-number {
      font-size: 0.75rem;
      color: var(--accent-yellow);
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      color: #fff;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-prefix {
      font-weight: 800;
      margin-right: 10px;
      color: var(--accent-yellow);
      min-width: 22px;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.3) !important;
      border-color: #10b981 !important;
      color: #a7f3d0 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.3) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
    }

    /* Screens: Start & Result */
    .modal-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .game-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 6px;
      background: linear-gradient(45deg, var(--p1-color), var(--p2-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .game-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .input-group {
      width: 100%;
      max-width: 320px;
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    .input-group.p1 label { color: var(--p1-color); }
    .input-group.p2 label { color: var(--p2-color); }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(45deg, #00f2ff, #0066ff);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      padding: 12px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 255, 0.4);
      margin-top: 10px;
      text-transform: uppercase;
    }

    .trophy-icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 14px;
    }

    canvas#fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 90;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- START SCREEN -->
    <div id="startScreen" class="modal-screen">
      <div class="game-title">ĐẤU TRƯỜNG 1V1</div>
      <div class="game-subtitle">Bài 7: Sản xuất kinh doanh & Các mô hình SXKD</div>

      <div class="input-group p1">
        <label for="p1Input">Tên Người Chơi 1 (Xanh)</label>
        <input type="text" id="p1Input" value="Học Sinh A" maxlength="12">
      </div>

      <div class="input-group p2">
        <label for="p2Input">Tên Người Chơi 2 (Đỏ)</label>
        <input type="text" id="p2Input" value="Học Sinh B" maxlength="12">
      </div>

      <button class="btn-primary" onclick="startGame()">BẮT ĐẦU ĐẤU TRƯỜNG</button>
    </div>

    <!-- MAIN GAME PLAY -->
    <div class="scoreboard">
      <div id="p1Card" class="player-card p1-card active">
        <span class="player-name" id="p1Name">HS A</span>
        <span class="score" id="p1Score">0</span>
      </div>
      <div class="versus">VS</div>
      <div id="p2Card" class="player-card p2-card">
        <span class="player-name" id="p2Name">HS B</span>
        <span class="score" id="p2Score">0</span>
      </div>
    </div>

    <div class="timer-container">
      <div id="timerBar" class="timer-bar"></div>
    </div>

    <div id="turnBanner" class="turn-banner p1">LƯỢT CỦA: HỌC SINH A</div>

    <div class="question-box">
      <div class="question-number" id="qNum">CÂU 1 / 20</div>
      <div class="question-text" id="qText">Nội dung câu hỏi sẽ hiển thị tại đây...</div>
    </div>

    <div class="options-grid" id="optionsContainer">
      <!-- Options injected by JS -->
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="modal-screen hidden">
      <canvas id="fireworks"></canvas>
      <div class="trophy-icon">🏆</div>
      <div class="game-subtitle">CHIẾN THẮNG CHUNG CUỘC</div>
      <div class="winner-name" id="wName">HỌC SINH A</div>
      <div class="game-subtitle" id="finalScores">Tỷ số: 120 - 80</div>
      <button class="btn-primary" onclick="location.reload()">THI ĐẤU LẠI</button>
    </div>

  </div>

  <script>
    // 20 CÂU HỎI TRỌNG TÂM BÀI 7 GDKT&PL 10
    const questions = [
      {
        q: "Hợp tác xã do ít nhất bao nhiêu thành viên tự nguyện thành lập?",
        options: ["3 thành viên", "5 thành viên", "7 thành viên", "10 thành viên"],
        answer: 1
      },
      {
        q: "Liên hiệp hợp tác xã do ít nhất bao nhiêu hợp tác xã tự nguyện thành lập?",
        options: ["2 hợp tác xã", "3 hợp tác xã", "5 hợp tác xã", "7 hợp tác xã"],
        answer: 1
      },
      {
        q: "Hoạt động thực hiện liên tục các công đoạn từ sản xuất đến tiêu thụ nhằm mục đích thu lợi nhuận gọi là gì?",
        options: ["Kinh doanh", "Tiêu dùng", "Đầu cơ", "Từ thiện"],
        answer: 0
      },
      {
        q: "Mô hình kinh doanh nào do 1 cá nhân hoặc thành viên hộ gia đình thành lập và chịu trách nhiệm vô hạn?",
        options: ["Công ty Cổ phần", "Hộ kinh doanh", "Doanh nghiệp nhà nước", "Công ty TNHH"],
        answer: 1
      },
      {
        q: "Chủ Doanh nghiệp tư nhân chịu trách nhiệm tài sản đối với hoạt động kinh doanh như thế nào?",
        options: ["Trách nhiệm hữu hạn", "Trách nhiệm vô hạn", "Không chịu trách nhiệm", "Chịu 50% rủi ro"],
        answer: 1
      },
      {
        q: "Mô hình doanh nghiệp nào dưới đây CÓ QUYỀN PHÁT HÀNH CỔ PHIẾU để huy động vốn?",
        options: ["Công ty Cổ phần", "Công ty TNHH", "Doanh nghiệp tư nhân", "Hộ kinh doanh"],
        answer: 0
      },
      {
        q: "Doanh nghiệp Nhà nước là doanh nghiệp do Nhà nước nắm giữ bao nhiêu phần trăm vốn điều lệ?",
        options: ["Trên 30%", "Đúng 50%", "Trên 50%", "100% tuyệt đối"],
        answer: 2
      },
      {
        q: "Công ty TNHH 2 thành viên trở lên có số lượng thành viên tối đa là bao nhiêu?",
        options: ["10 thành viên", "30 thành viên", "50 thành viên", "Không giới hạn"],
        answer: 2
      },
      {
        q: "Đặc điểm nào sau đây KHÔNG đúng với Hộ kinh doanh?",
        options: ["Quy mô nhỏ gọn", "Chịu trách nhiệm vô hạn", "Được phát hành cổ phiếu", "Bộ máy đơn giản"],
        answer: 2
      },
      {
        q: "Trong Công ty Hợp danh, thành viên hợp danh chịu trách nhiệm về các nghĩa vụ của công ty như thế nào?",
        options: ["Vô hạn bằng toàn bộ tài sản", "Hữu hạn trong vốn góp", "Không phải chịu trách nhiệm", "Chỉ chịu trách nhiệm 1 năm"],
        answer: 0
      },
      {
        q: "Nội dung nào sau đây phản ánh đúng vai trò của sản xuất kinh doanh?",
        options: ["Tạo việc làm và thu nhập", "Đáp ứng nhu cầu xã hội", "Thúc đẩy phát triển kinh tế", "Tất cả các ý trên"],
        answer: 3
      },
      {
        q: "Mô hình kinh doanh nào mang tính chất tập thể, đồng sở hữu và hỗ trợ lẫn nhau giữa các thành viên?",
        options: ["Doanh nghiệp tư nhân", "Hợp tác xã", "Công ty Cổ phần", "Hộ kinh doanh"],
        answer: 1
      },
      {
        q: "Cổ đông trong Công ty Cổ phần chịu trách nhiệm về các khoản nợ của doanh nghiệp trong phạm vi nào?",
        options: ["Toàn bộ tài sản cá nhân", "Số vốn đã góp vào công ty", "Toàn bộ tài sản gia đình", "Không bị mất vốn"],
        answer: 1
      },
      {
        q: "Khai thác nguồn lực, tạo ra sản phẩm hàng hóa phục vụ nhu cầu thị trường là hoạt động gì?",
        options: ["Sản xuất kinh doanh", "Phân phối thu nhập", "Quản lý hành chính", "Giao lưu văn hóa"],
        answer: 0
      },
      {
        q: "Mô hình Công ty TNHH 1 thành viên do đối tượng nào sau đây làm chủ sở hữu?",
        options: ["Một cá nhân hoặc một tổ chức", "Ít nhất 5 cá nhân", "Từ 2 đến 50 tổ chức", "Tất cả người dân"],
        answer: 0
      },
      {
        q: "Doanh nghiệp tư nhân KHÔNG được phép làm điều nào sau đây?",
        options: ["Mở rộng quy mô", "Thuê lao động", "Phát hành bất kỳ loại chứng khoán nào", "Ký kết hợp đồng"],
        answer: 2
      },
      {
        q: "Điểm khác biệt cơ bản giữa trách nhiệm hữu hạn và vô hạn trong kinh doanh là gì?",
        options: ["Phạm vi tài sản chịu rủi ro", "Số tiền đóng thuế", "Tên gọi doanh nghiệp", "Số lượng sản phẩm"],
        answer: 0
      },
      {
        q: "Mục đích cuối cùng của các chủ thể khi tham gia hoạt động sản xuất kinh doanh là gì?",
        options: ["Nâng cao uy tín", "Thu lợi nhuận", "Mở rộng giao lưu", "Tạo sự chú ý"],
        answer: 1
      },
      {
        q: "Việc chuyển đổi từ Hộ kinh doanh lên Doanh nghiệp giúp chủ thể có lợi thế gì?",
        options: ["Huy động vốn dễ hơn", "Mở rộng quy mô lớn hơn", "Có tư cách pháp nhân", "Tất cả các ý trên"],
        answer: 3
      },
      {
        q: "Thành viên góp vốn trong công ty hợp danh chịu trách nhiệm về các khoản nợ như thế nào?",
        options: ["Hữu hạn trong phạm vi số vốn đã cam kết góp", "Vô hạn bằng toàn bộ tài sản", "Không chịu trách nhiệm", "Gấp đôi số vốn góp"],
        answer: 0
      }
    ];

    let p1 = { name: "HS A", score: 0 };
    let p2 = { name: "HS B", score: 0 };
    let activePlayer = 1; // 1 hoặc 2
    let currentQIdx = 0;
    let timer = null;
    let timeLeft = 20;

    // AM THANH TỰ TỔNG HỢP (Web Audio API)
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(130, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'tick') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch(e) {}
    }

    function startGame() {
      p1.name = document.getElementById('p1Input').value.trim() || "Học Sinh A";
      p2.name = document.getElementById('p2Input').value.trim() || "Học Sinh B";

      document.getElementById('p1Name').innerText = p1.name;
      document.getElementById('p2Name').innerText = p2.name;

      document.getElementById('startScreen').classList.add('hidden');
      loadQuestion();
    }

    function updateTurnUI() {
      const banner = document.getElementById('turnBanner');
      const p1Card = document.getElementById('p1Card');
      const p2Card = document.getElementById('p2Card');

      if (activePlayer === 1) {
        banner.innerText = `LƯỢT CỦA: ${p1.name.toUpperCase()}`;
        banner.className = "turn-banner p1";
        p1Card.classList.add('active');
        p2Card.classList.remove('active');
      } else {
        banner.innerText = `LƯỢT CỦA: ${p2.name.toUpperCase()}`;
        banner.className = "turn-banner p2";
        p2Card.classList.add('active');
        p1Card.classList.remove('active');
      }
    }

    function loadQuestion() {
      if (currentQIdx >= questions.length) {
        endGame();
        return;
      }

      updateTurnUI();

      const q = questions[currentQIdx];
      document.getElementById('qNum').innerText = `CÂU ${currentQIdx + 1} / ${questions.length}`;
      document.getElementById('qText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const prefixes = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}.</span> ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
      });

      resetTimer();
    }

    function resetTimer() {
      clearInterval(timer);
      timeLeft = 20;
      const bar = document.getElementById('timerBar');
      bar.style.width = '100%';

      timer = setInterval(() => {
        timeLeft -= 0.1;
        bar.style.width = `${(timeLeft / 20) * 100}%`;

        if (Math.ceil(timeLeft) <= 5 && Math.floor(timeLeft * 10) % 10 === 0) {
          playSound('tick');
        }

        if (timeLeft <= 0) {
          clearInterval(timer);
          playSound('wrong');
          switchTurn();
        }
      }, 100);
    }

    function checkAnswer(selectedIdx) {
      clearInterval(timer);
      const q = questions[currentQIdx];
      const btns = document.querySelectorAll('.option-btn');

      btns.forEach(btn => btn.style.pointerEvents = 'none');

      if (selectedIdx === q.answer) {
        playSound('correct');
        btns[selectedIdx].classList.add('correct');
        if (activePlayer === 1) p1.score += 10;
        else p2.score += 10;

        document.getElementById('p1Score').innerText = p1.score;
        document.getElementById('p2Score').innerText = p2.score;

        setTimeout(() => {
          currentQIdx++;
          loadQuestion(); // Giữ lượt chơi tiếp
        }, 1200);

      } else {
        playSound('wrong');
        btns[selectedIdx].classList.add('wrong');
        btns[q.answer].classList.add('correct');

        setTimeout(() => {
          switchTurn();
        }, 1500);
      }
    }

    function switchTurn() {
      activePlayer = activePlayer === 1 ? 2 : 1;
      currentQIdx++;
      loadQuestion();
    }

    function endGame() {
      document.getElementById('resultScreen').classList.remove('hidden');
      const wName = document.getElementById('wName');
      const finalScores = document.getElementById('finalScores');

      if (p1.score > p2.score) {
        wName.innerText = `🏆 ${p1.name} THẮNG!`;
      } else if (p2.score > p1.score) {
        wName.innerText = `🏆 ${p2.name} THẮNG!`;
      } else {
        wName.innerText = "🤝 HÒA NHAU!";
      }

      finalScores.innerText = `${p1.name}: ${p1.score} điểm | ${p2.name}: ${p2.score} điểm`;
      startFireworks();
    }

    // Hiệu ứng Pháo hoa đơn giản
    function startFireworks() {
      const canvas = document.getElementById('fireworks');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          size: Math.random() * 4 + 2
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
